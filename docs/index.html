<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Likhit Guru - Nepal Driving License Preparation</title>
  <meta name="description" content="Likhit Guru - Your complete Nepal driving license exam preparation app. Practice questions, mock tests, and more.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
      color: #E2E8F0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .container { max-width: 480px; }
    .logo { font-size: 64px; margin-bottom: 16px; }
    h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, #22C55E, #10B981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    p {
      font-size: 16px;
      color: #94A3B8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 8px 20px;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 24px;
      color: #22C55E;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📝</div>
    <h1>Likhit Guru</h1>
    <p>Your complete Nepal driving license exam preparation app. Practice questions for bike, car & other vehicle categories with mock tests and daily quizzes.</p>
    <span class="badge">Available on Google Play & App Store</span>
  </div>
</body>
</html>
